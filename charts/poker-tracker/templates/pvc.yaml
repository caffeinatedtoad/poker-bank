apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "poker-tracker.fullname" . }}-data
  labels:
    {{- include "poker-tracker.labels" . | nindent 4 }}
  annotations:
    # `helm uninstall` leaves this volume (and the SQLite file on it) alone. Reinstalling with the same
    # release name picks it up again. Delete it by hand only when you really mean to lose the data.
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
