# ClusterIP only: reachable inside the cluster, never from the LAN or internet directly.
# The app trusts Pangolin's identity header, so the only way in must be through Pangolin.
# Point Pangolin (its Newt connector running in the cluster) at http://poker-tracker.<namespace>.svc:80
apiVersion: v1
kind: Service
metadata:
  name: poker-tracker
spec:
  type: ClusterIP
  selector:
    app: poker-tracker
  ports:
    - port: 80
      targetPort: 3000
